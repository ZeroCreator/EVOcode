version: "3.8"

services:
  evocode:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: evocode-landing
    ports:
      - "80:80"
      - "443:443"
    restart: unless-stopped
    volumes:
      - caddy-data:/data
      - caddy-config:/config

volumes:
  caddy-data:
  caddy-config:
